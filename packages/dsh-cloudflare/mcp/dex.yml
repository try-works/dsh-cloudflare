# Optional Cloudflare MCP server overlay: Digital Experience Monitoring.
#
# NOT mounted by the plugin by default — for 1:1 Codex parity the bundle ships
# only the cloudflare-api Code Mode server. Opt in per profile with:
#
#   dsh --profile <profile> --patch <path-to-this-file>
#
# See the repository README for the full Cloudflare MCP server catalog.

- insert:
    - id: cloudflare-dex
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cloudflare-dex
        transport: streamable-http
        url: https://dex.mcp.cloudflare.com/mcp
