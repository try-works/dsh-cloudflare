# Optional Cloudflare MCP server overlay: ALL domain-specific servers.
#
# Opts in to every Cloudflare domain-specific MCP server listed in the
# repository README, alongside the always-on cloudflare-api Code Mode server.
# NOT mounted by default — apply explicitly:
#
#   dsh --profile <profile> --patch <path-to-this-file>
#
# Prefer the per-server files in this directory to pick a subset.

- insert:
    - id: cloudflare-ai-gateway
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cloudflare-ai-gateway
        transport: streamable-http
        url: https://ai-gateway.mcp.cloudflare.com/mcp
    - id: cloudflare-audit-logs
      name: '@deepseek-ai/dsh-mcp-client'
      config:
